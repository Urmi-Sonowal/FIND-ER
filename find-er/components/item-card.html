<div class="item-card" data-item-id="[[ITEM_ID]]">
    <div class="item-card-img">
        [[MATCH_HINT]]
        <img src="[[IMAGE_URL]]" alt="[[ITEM_NAME]]" loading="lazy">
        <span class="item-status-badge [[STATUS_CLASS]]">[[STATUS_TEXT]]</span>
    </div>
    <div class="item-card-body">
        <span class="item-category-pill">[[CATEGORY]]</span>
        <h3 class="item-name">[[ITEM_NAME]]</h3>
        <div class="item-meta">
            <span>📍 [[LOCATION]]</span>
            <span>📅 [[DATE]]</span>
        </div>
        <div class="item-reporter">
            Reported by: [[REPORTER_ID]]
            [[PHONE_HTML]]
        </div>
    </div>
    <div class="item-card-footer">
        <span class="phone-tag">[[PHONE]]</span>
        <a class="btn btn-outline btn-sm" href="item-detail.html?id=[[ITEM_ID]]">View Details</a>
    </div>
    [[ADMIN_CONTROLS]]
</div>

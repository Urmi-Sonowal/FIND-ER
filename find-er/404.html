<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Find-ER</title>
    <meta name="description" content="Page not found on Find-ER.">
    <link rel="icon" href="assets/images/logo1.png">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/utilities.css">
    <link rel="stylesheet" href="assets/css/prelogin-components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <div id="loader-container"></div>

    <!-- DECORATIVE BACKGROUND ELEMENTS -->
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-pattern"></div>

    <!-- NAVIGATION -->
    <div id="navbar-container"></div>

    <main class="page-not-found" style="padding: 60px 20px;">
        <div style="max-width: 900px; margin: 0 auto; text-align: center;">
            <div style="font-size: 96px; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
            <h2 style="margin-top: -10px;">Page not found</h2>
            <p style="color: var(--gray-500); max-width: 560px; margin: 10px auto 30px;">
                The page you're looking for doesn't exist or may have moved.
            </p>
            <div style="display:flex; gap: 14px; justify-content:center; flex-wrap:wrap;">
                <a href="welcome.html" class="btn btn-primary">
                    <i data-lucide="home" style="vertical-align: middle; margin-right: 8px;"></i>
                    Go Home
                </a>
                <a href="dashboard/student-dashboard.html" class="btn btn-outline">
                    <i data-lucide="layout-dashboard" style="vertical-align: middle; margin-right: 8px;"></i>
                    Go to Dashboard
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-prelogin-container"></div>

    <script src="js/constants.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        fetch('components/navbar-prelogin.html')
            .then(res => res.text())
            .then(data => document.getElementById('navbar-container').innerHTML = data);
        fetch('components/footer-prelogin.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-prelogin-container').innerHTML = data);
        fetch('components/loader.html')
            .then(res => res.text())
            .then(data => document.getElementById('loader-container').innerHTML = data);
        
        setTimeout(() => {
            if (window.lucide) lucide.createIcons();
        }, 100);
    </script>
</body>
</html>

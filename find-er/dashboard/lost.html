<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Items | Find-ER</title>
    <link rel="icon" href="../assets/images/logo1.png">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/notifications.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .items-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .items-header h1 { font-size: 28px; font-weight: 800; color: #1e293b; margin: 0; }
        .items-header h1 span { color: #2f7fa2; }
        .filter-section { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-select, .search-box { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 40px; font-size: 14px; background: white; }
        .search-box { display: flex; align-items: center; gap: 8px; }
        .search-box input { border: none; outline: none; width: 200px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .item-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
        .item-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .item-card-img { height: 160px; position: relative; background: #f1f5f9; }
        .item-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .item-status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .item-card-body { padding: 16px; }
        .item-category-pill { display: inline-block; padding: 4px 10px; background: #eef2ff; color: #2f7fa2; border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 10px; }
        .item-name { font-size: 16px; font-weight: 700; margin: 0 0 8px; color: #1e293b; }
        .item-meta { font-size: 12px; color: #64748b; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .item-reporter { font-size: 11px; color: #94a3b8; padding-top: 10px; border-top: 1px solid #e2e8f0; }
        .item-card-footer { padding: 12px 16px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; background: #f8fafc; }
        .empty-state { text-align: center; padding: 60px; background: white; border-radius: 16px; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        @media (max-width: 768px) { .items-header { flex-direction: column; } .filter-section { width: 100%; } .search-box input { width: 100%; } }
    </style>
</head>
<body class="find-er-app">
    <div class="bg-pattern"></div>
    <div id="loader-container"></div>
    
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <div id="top-header-container"></div>
            
            <div class="dashboard-container">
                <!-- Admin Control Bar (hidden for students) -->
                <div id="adminControlBar" class="admin-control-bar" style="display: none;">
                    <span class="admin-badge">ADMIN MODE</span>
                    <div style="display: flex; gap: 10px;">
                        <button class="admin-action-btn" onclick="window.exportData?.()">📥 Export CSV</button>
                    </div>
                </div>
                
                <div class="items-header">
                    <h1>Lost <span>Items</span></h1>
                    <div class="filter-section">
                        <select id="categoryFilter" class="filter-select">
                            <option value="all">All Categories</option>
                            <option>ID Card</option><option>Electronics</option><option>Books</option>
                            <option>Accessories</option><option>Keys</option><option>Bag</option>
                            <option>Water Bottle</option><option>Wallet</option>
                        </select>
                        <div class="search-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="searchInput" placeholder="Search lost items...">
                        </div>
                    </div>
                </div>
                
                <div id="itemsGrid" class="items-grid"></div>
                
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-content"><h3 id="totalLost">0</h3><p>Total Lost</p></div></div>
                    <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-content"><h3 id="underReview">0</h3><p>Under Review</p></div></div>
                    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-content"><h3 id="recovered">0</h3><p>Recovered</p></div></div>
                </div>
            </div>
            
            <div id="footer-container"></div>
        </main>
    </div>

    <button type="button" id="backToTopBtn" class="back-to-top"><i data-lucide="chevron-up"></i></button>

    <script src="../js/constants.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/dropdowns.js"></script>
    <script src="../js/modals.js"></script>
    <script src="../js/loaders.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        Promise.all([
            fetch('../components/sidebar.html').then(res => res.text()),
            fetch('../components/top-header.html').then(res => res.text()),
            fetch('../components/footer.html').then(res => res.text()),
            fetch('../components/loader.html').then(res => res.text())
        ]).then(([sidebar, header, footer, loader]) => {
            document.getElementById('sidebar-container').innerHTML = sidebar;
            document.getElementById('top-header-container').innerHTML = header;
            document.getElementById('footer-container').innerHTML = footer;
            document.getElementById('loader-container').innerHTML = loader;
            
            setTimeout(() => {
                if (window.lucide) lucide.createIcons();
                if (window.FindERApp) window.FindERApp.reinit();
                loadLostItems();
                // Refresh sidebar badges and notifications
                if (typeof refreshNavCounts === 'function') refreshNavCounts();
                const loaderEl = document.getElementById('pageLoader');
                if (loaderEl) { loaderEl.classList.add('hidden'); setTimeout(() => loaderEl.style.display = 'none', 500); }
            }, 100);
        });
        
        // Update sidebar/found badges and notification badges
        function refreshNavCounts() {
            const storage = window.Storage || window.FindERStorage;
            const reports = storage && typeof storage.getReports === 'function' ? storage.getReports() : JSON.parse(localStorage.getItem('findER_reports') || '[]');
            const lostCount = (reports || []).filter(r => r.type === 'lost').length;
            const foundCount = (reports || []).filter(r => r.type === 'found').length;
            const lostBadge = document.getElementById('lostBadge');
            const foundBadge = document.getElementById('foundBadge');
            if (lostBadge) { lostBadge.textContent = lostCount > 9 ? '9+' : lostCount; lostBadge.style.display = lostCount > 0 ? 'inline-flex' : 'none'; }
            if (foundBadge) { foundBadge.textContent = foundCount > 9 ? '9+' : foundCount; foundBadge.style.display = foundCount > 0 ? 'inline-flex' : 'none'; }

            // Notifications
            const currentUser = storage && typeof storage.getCurrentUser === 'function' ? storage.getCurrentUser() : null;
            const unread = currentUser && storage && typeof storage.getUnreadCount === 'function' ? storage.getUnreadCount(currentUser.collegeId) : 0;
            document.querySelectorAll('.notification-badge, #sidebarNotifBadge, #headerNotifBadge').forEach(b => {
                if (unread > 0) { b.textContent = unread > 99 ? '99+' : String(unread); b.style.display = 'flex'; } else { b.style.display = 'none'; }
            });
        }
        
        function loadLostItems() {
            const reports = JSON.parse(localStorage.getItem('findER_reports') || '[]');
            const lostItems = reports.filter(r => r.type === 'lost');
            
            // Update stats
            const total = lostItems.length;
            const underReview = lostItems.filter(i => i.status === 'pending').length;
            const recovered = lostItems.filter(i => i.status === 'collected').length;
            document.getElementById('totalLost').textContent = total;
            document.getElementById('underReview').textContent = underReview;
            document.getElementById('recovered').textContent = recovered;
            
            renderItems(lostItems);
            
            // Setup filters
            const categoryFilter = document.getElementById('categoryFilter');
            const searchInput = document.getElementById('searchInput');
            
            function filterItems() {
                const category = categoryFilter.value;
                const search = searchInput.value.toLowerCase();
                
                let filtered = lostItems;
                if (category !== 'all') filtered = filtered.filter(i => i.category === category);
                if (search) filtered = filtered.filter(i => i.name.toLowerCase().includes(search) || i.location.toLowerCase().includes(search));
                renderItems(filtered);
            }
            
            categoryFilter.addEventListener('change', filterItems);
            searchInput.addEventListener('input', filterItems);
        }
        
        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            
            if (!items.length) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>No lost items found</h3><p>Be the first to report a lost item.</p><a href="report.html" class="btn btn-primary">Report Item</a></div>`;
                return;
            }
            
            const statusMap = {
                'pending': { class: 'status-pending', text: 'Under Review' },
                'verified': { class: 'status-verified', text: 'Verified' },
                'ready': { class: 'status-ready', text: 'Ready for Pickup' },
                'matched': { class: 'status-matched', text: 'Matched' },
                'collected': { class: 'status-collected', text: 'Recovered' }
            };
            
            grid.innerHTML = items.map(item => {
                const status = statusMap[item.status] || statusMap.pending;
                const imgSrc = item.image || getCategoryImage(item.category);
                return `
                    <div class="item-card" onclick="window.location.href='item-detail.html?id=${item.id}'">
                        <div class="item-card-img">
                            <img src="${imgSrc}" alt="${escapeHtml(item.name)}" onerror="this.src='https://images.unsplash.com/photo-1586769852044-692d6e3703f2?w=400'">
                            <span class="item-status-badge ${status.class}">${status.text}</span>
                        </div>
                        <div class="item-card-body">
                            <span class="item-category-pill">${escapeHtml(item.category)}</span>
                            <h3 class="item-name">${escapeHtml(item.name)}</h3>
                            <div class="item-meta">
                                <span>📍 ${escapeHtml(item.location)}</span>
                                <span>📅 ${formatDate(item.date)}</span>
                            </div>
                            <div class="item-reporter">Reported by: ${escapeHtml(item.reporterId || item.collegeId || '')}</div>
                        </div>
                        <div class="item-card-footer">
                            <button class="btn btn-outline btn-sm">View Details</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        function formatDate(dateStr) { if (!dateStr) return 'N/A'; try { return new Date(dateStr).toLocaleDateString(); } catch(e) { return dateStr; } }
        function getCategoryImage(category) {
            const cat = (category || '').toLowerCase();
            if (cat.includes('id')) return 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400';
            if (cat.includes('phone') || cat.includes('electronic')) return 'https://images.unsplash.com/photo-1468495244123-6c6c332eeece?w=400';
            if (cat.includes('book')) return 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=400';
            if (cat.includes('bag')) return 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400';
            if (cat.includes('key')) return 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400';
            if (cat.includes('watch') || cat.includes('access')) return 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';
            if (cat.includes('water')) return 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400';
            return 'https://images.unsplash.com/photo-1586769852044-692d6e3703f2?w=400';
        }
    </script>
</body>
</html>
